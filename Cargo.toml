[workspace]
members = ["native/crates/supp-project", "native/crates/supp-media", "native/crates/supp-export", "src-tauri"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"

# Media analysis runs per pixel and per frame over long footage; unoptimized it costs ~2 s of
# analysis per second of footage in the desktop's dev build. Optimize it (and the image math it
# leans on) even there; the rest of the dev build stays fast to compile.
[profile.dev.package.supp-media]
opt-level = 3
