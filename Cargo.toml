[workspace]
members = ["native/crates/supp-project", "native/crates/supp-media", "native/crates/supp-export", "src-tauri"]
resolver = "2"
[workspace.package]
version = "0.1.0"
edition = "2021"
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
